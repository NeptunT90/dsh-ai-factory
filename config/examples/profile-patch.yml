# Пример пользовательского слоя профиля DSH.
# Файл кладётся в %USERPROFILE%\.dsh\profiles\<profile>\cordis.patch.yml
# (не заменяйте существующие записи; добавьте этот блок в конец массива).
#
# Patch заменяет конфигурацию строки целиком, поэтому перечислены все поля,
# которые нужно сохранить. Значения ниже — defaults Phase 1.

- id: ai-factory
  config:
    enabled: true
    dataDir: ''
    dbFile: factory.db
    maxSearchResults: 20
    workingMemoryTtlHours: 72
    maxContentChars: 100000
    defaultAutonomy: autonomous
    allowGlobalMemory: true
    projectIdOverride: ''
    redactLogs: true
    logLevel: info
    syncUrl: ''
    syncTokenEnv: DSH_AI_FACTORY_SYNC_TOKEN
    syncDeviceId: ''
    syncBatchSize: 50
    syncTimeoutMs: 15000
    syncAuto: false
    syncIntervalSeconds: 60
    modelRouterEnabled: true
    modelFallbacks: ''
    modelMaxAttempts: 2
