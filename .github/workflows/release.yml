name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $pkg = Get-Content plugin/package.json -Raw | ConvertFrom-Json
          $expected = "v$($pkg.version)"
          if ($env:GITHUB_REF_NAME -ne $expected) {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $expected"
          }

      - name: Typecheck
        run: pnpm typecheck

      - name: Test plugin
        run: pnpm test

      - name: Server typecheck
        run: pnpm server:typecheck

      - name: Test sync server
        run: pnpm server:test

      - name: Build and package
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package.ps1

      - name: Verify package
        shell: pwsh
        run: |
          $pkg = Get-Content plugin/package.json -Raw | ConvertFrom-Json
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-package.ps1 -Tarball "dist/dsh-ai-factory-$($pkg.version).tgz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-ai-factory-release
          path: |
            dist/*.tgz
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tgz
            dist/SHA256SUMS
          generate_release_notes: true
